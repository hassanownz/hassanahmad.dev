name: chess snapshot

# Runs an hour after the chess repo's own snapshot Action (03:00 UTC), so it
# reads a fresh file. The commit is what triggers the Pages build.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chess-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Non-zero exit here leaves the committed numbers in place.
      - name: Inline the chess snapshot
        run: node scripts/chess-snapshot.mjs

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "no change — skipping commit"
            exit 0
          fi
          git commit -m "chess: snapshot $(date -u +%Y-%m-%d)"
          git push
